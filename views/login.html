<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login — AgriRent</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <div class="top-strip">
        <span>Delivering across Karnataka &middot; Bengaluru, Mysuru, Hubballi &amp; more</span>
        <a href="/contact">Need help renting? Talk to us →</a>
    </div>

    <nav>
        <a href="/home" class="logo">Agri<span>Rent</span></a>
        <form class="nav-search" action="/search" method="get">
            <select name="category" aria-label="Category">
                <option value="">All categories</option>
                <option value="tractor">Tractors</option>
                <option value="harvestor">Harvesters</option>
                <option value="rotavator">Rotavators</option>
                <option value="cultivator">Cultivators</option>
                <option value="sprayer">Sprayers</option>
                <option value="trailer">Trailers</option>
            </select>
            <input type="text" name="query" placeholder="Search tractors, harvesters, rotavators...">
            <button type="submit">Search</button>
        </form>
        <div class="nav-links">
            <a href="/login">Login</a>
            <span class="divider"></span>
            <a href="/register">Register</a>
        </div>
    </nav>

    <div class="breadcrumb">
        <a href="/home">Home</a> &nbsp;›&nbsp; Login
    </div>

    <div class="auth-wrap">
        <div class="login-container">
            <span class="hero-eyebrow" style="background:var(--forest-100);color:var(--forest-700);">Welcome back</span>
            <h2>Login</h2>
            <p class="auth-sub">New to AgriRent? <a href="/register">Create an account</a></p>
            <form id="loginForm" novalidate>
                <div class="form-error" id="loginError" hidden></div>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required>

                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Password" required>

                <button type="submit" class="btn-primary loginbutton" id="loginSubmit">Login</button>
            </form>
        </div>
    </div>

    <footer>
        AgriRent &middot; Connecting farmers and equipment owners across India &middot;
        <a href="/about" style="color:#cfe4d3;">About</a> &middot;
        <a href="/contact" style="color:#cfe4d3;">Contact</a>
    </footer>

    <script src="/js/auth.js"></script>
</body>

</html>
